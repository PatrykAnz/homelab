apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 81.2.2
    chart: kube-prometheus-stack
    helm:
      skipCrds: true
      values: |
        prometheus-node-exporter:
          enabled: true
          tolerations:
            - operator: Exists
          hostRootFsMount:
            enabled: false

        prometheusOperator:
          admissionWebhooks:
            failurePolicy: Ignore

        grafana:
          enabled: true

          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password

          persistence:
            enabled: true
            size: 5Gi

          service:
            type: ClusterIP

          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.homelab.local
            path: /
            pathType: Prefix

        prometheus:
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi

        alertmanager:
          enabled: true
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

        kube-state-metrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
