name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/*.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================
  # Validate pull requests without Azure credentials.
  # ============================================
  terraform-validate:
    name: Terraform Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~> 1.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  # ============================================
  # Plan runs only on main in the protected environment.
  # ============================================
  terraform-plan:
    name: Terraform Plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      working_directory: infra/terraform
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      AZURE_TFSTATE_CONTAINER: ${{ secrets.AZURE_TFSTATE_CONTAINER }}
      AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
      TF_LOCATION: ${{ secrets.TF_LOCATION }}
      TF_USER_ASSIGNED_IDENTITY_NAME: ${{ secrets.TF_USER_ASSIGNED_IDENTITY_NAME }}
      TF_GITHUB_ORG: ${{ secrets.TF_GITHUB_ORG }}
      TF_GITHUB_REPO: ${{ secrets.TF_GITHUB_REPO }}

  # ============================================
  # The apply job itself waits for production environment approval;
  # a separate approval job would not pass its environment identity on.
  # ============================================
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.terraform-plan.outputs.has_changes == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      working_directory: infra/terraform
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      AZURE_TFSTATE_CONTAINER: ${{ secrets.AZURE_TFSTATE_CONTAINER }}
      AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
      TF_LOCATION: ${{ secrets.TF_LOCATION }}
      TF_USER_ASSIGNED_IDENTITY_NAME: ${{ secrets.TF_USER_ASSIGNED_IDENTITY_NAME }}
      TF_GITHUB_ORG: ${{ secrets.TF_GITHUB_ORG }}
      TF_GITHUB_REPO: ${{ secrets.TF_GITHUB_REPO }}
