apiVersion: batch/v1
kind: Job
metadata:
  name: daylog-garmin-sync-annual
  namespace: daylog
  labels:
    app: daylog
spec:
  template:
    spec:
      serviceAccountName: daylog-automation
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: daylog-garmin-sync
          image: ghcr.io/patrykanz/daylog:main
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - python -m backend.api.garmin
          env:
            - name: KEY_VAULT_NAME
              valueFrom:
                secretKeyRef:
                  name: azure-config
                  key: key-vault-name
            - name: DB_HOST
              value: daylog-database-rw.daylog.svc.cluster.local
            - name: SYNC_MODE
              value: "year"
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-creds
                  key: ClientID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-creds
                  key: ClientSecret
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-config
                  key: tenant-id
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      restartPolicy: Never
  backoffLimit: 2
