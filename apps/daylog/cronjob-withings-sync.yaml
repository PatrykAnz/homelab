apiVersion: batch/v1
kind: CronJob
metadata:
  name: daylog-withings-sync
  namespace: daylog
  labels:
    app: daylog
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: daylog-automation
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: daylog-withings-sync
              image: ghcr.io/patrykanz/daylog:main
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - python -m backend.api.withings
              env:
                - name: SYNC_MODE
                  value: "last_7_days"
                - name: KEY_VAULT_NAME
                  valueFrom:
                    secretKeyRef:
                      name: azure-config
                      key: key-vault-name
                - name: DB_HOST
                  value: daylog-database-rw.daylog.svc.cluster.local
                - name: AZURE_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: azure-creds
                      key: ClientID
                - name: AZURE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: azure-creds
                      key: ClientSecret
                - name: AZURE_TENANT_ID
                  valueFrom:
                    secretKeyRef:
                      name: azure-config
                      key: tenant-id
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          restartPolicy: OnFailure
