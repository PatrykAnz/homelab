repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(ya?ml|md)$
        args: [--write]

  - repo: local
    hooks:
      - id: terraform_fmt
        name: terraform fmt
        entry: terraform fmt -recursive
        language: system
        files: \.tf$
        exclude: \.terraform/
        pass_filenames: false

      - id: terraform_validate
        name: terraform validate
        entry: terraform validate
        language: system
        files: \.tf$
        exclude: \.terraform/
        pass_filenames: false

      - id: tflint
        name: tflint
        entry: tflint --recursive
        language: golang
        additional_dependencies:
          - github.com/terraform-linters/tflint@v0.54.0
        files: \.tf$
        exclude: \.terraform/
        pass_filenames: false

      - id: kubeconform
        name: kubeconform linter
        entry: kubeconform -summary -strict -ignore-missing-schemas -skip CustomResourceDefinition
        language: golang
        additional_dependencies:
          - github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
        files: \.ya?ml$
        exclude: ^(\.pre-commit-config\.yaml|\.github/|host-services/)

      - id: tfsec
        name: TFSec
        entry: tfsec
        language: golang
        additional_dependencies:
          - github.com/aquasecurity/tfsec/cmd/tfsec@v1.28.11
        files: \.tf$
        exclude: \.terraform/
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
        files: \.ya?ml$
        exclude: ^(\.pre-commit-config\.yaml|host-services/)
