name: home-automation

secrets:
  mqtt_password:
    file: ./secrets/mqtt_password

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.21 
    restart: unless-stopped
    # Host-network HA reaches the broker via 127.0.0.1:1884 (keep this mapping); container services use mosquitto:1883.
    ports:
      - "1884:1883"
    environment:
      - TZ=Europe/Warsaw
      - MQTT_USER=${MQTT_USER}
    secrets:
      - mqtt_password
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h localhost -p 1883 -u "$$MQTT_USER" -P "$$(cat /run/secrets/mqtt_password)" -t '$$SYS/broker/uptime' -C 1 -W 3
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.7.1  
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Warsaw
      - ZIGBEE2MQTT_DATA=/app/data
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=mqtt://mosquitto:1883
      - ZIGBEE2MQTT_CONFIG_MQTT_USER=${MQTT_USER}
      - ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD_FILE=/run/secrets/mqtt_password
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT=${ZIGBEE_DEVICE}
    secrets:
      - mqtt_password
    devices:
      - "${ZIGBEE_DEVICE}:${ZIGBEE_DEVICE}"
    volumes:
      - zigbee2mqtt_data:/app/data
      - /run/udev:/run/udev:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8080 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.6.0
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    network_mode: host
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./homeassistant:/config
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8123', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  mosquitto_data:
  mosquitto_log:
  zigbee2mqtt_data:
